name: publish

# Publish @ursuciprian/reflex when a version tag is pushed (v0.2.0 ...).
# The tag must match package.json's version. The same tarball goes to:
#   GitHub Packages  always, with the workflow's own GITHUB_TOKEN; installing needs a token
#                    with read:packages and read access to this repository
#   npmjs            only when the NPM_TOKEN repository secret exists (an npm access token for
#                    the `ursuciprian` account); public, anonymous installs. Adding that secret
#                    is the decision to publish Reflex publicly: npm versions cannot be withdrawn.
#
# Each publish gets its own setup-node step. setup-node writes an `@ursuciprian:registry=` line
# into .npmrc, and npm resolves a scoped package's registry from that line before `--registry`,
# so one .npmrc cannot serve both registries.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Offline selfchecks
        run: npm test
        env:
          REFLEX_DATA_DIR: ${{ runner.temp }}/reflex

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@ursuciprian"
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@ursuciprian"
      - name: Publish to npmjs
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
