name: publish

# Publish @ursuciprian/reflex when a version tag is pushed (v0.2.0 ...).
# The tag must match package.json's version. Published to two registries:
#   npmjs          needs the NPM_TOKEN repository secret (an npm access token for the
#                  `ursuciprian` account, Automation kind is enough); anonymous installs
#   GitHub Packages uses the workflow's own GITHUB_TOKEN; a token is needed to install from it
# Both are the same tarball, so `npm i -g @ursuciprian/reflex` works without any login.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@ursuciprian"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Offline selfchecks
        run: npm test
        env:
          REFLEX_DATA_DIR: ${{ runner.temp }}/reflex
      - name: Publish to npmjs
        run: npm publish --registry https://registry.npmjs.org --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
